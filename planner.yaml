action_type: differential_drive
sensor_needs: [laserscan]
obs_policy: latest_only

depends:
  global_plan: true

observations:
  aliases:
    robot_pose: robot_pose_from_tf

  datasources:
    robot_pose_from_tf:
      type: RobotPoseTFGenerator
      params: {}

    robot_state:
      type: nav_msgs/Odometry
      params:
        topic: odom

    laser_scan:
      type: sensor_msgs/LaserScan
      params:
        topic: scan
        canonical_beams: 180

    pedestrians:
      type: arena_people_msgs/Pedestrians
      params:
        topic: pedestrians

    goal_pose:
      type: geometry_msgs/PoseStamped
      params:
        topic: goal_pose

    global_plan:
      type: nav_msgs/Path
      params:
        topic: plan
