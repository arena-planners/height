[project]
name = "arena_planners_height"
version = "0.0.0"
description = "HEIGHT (selfAttn_merge_SRNN_lidar) crowd navigation wrapper for arena_planners bridge."
requires-python = ">=3.8,<3.9"
dependencies = [
    "arena_planners",
    "torch==1.12.1",
    "torchvision==0.13.1",
    "numpy<=1.23.1",
    "gym==0.15.7",
    "scipy>=1.7",
    "pyyaml",
]

[tool.uv.sources]
arena_planners = { git = "https://github.com/arena-planners/arena_planners.git", branch = "jazzy", subdirectory = "arena_planners" }

[tool.setuptools]
packages = []
py-modules = []
